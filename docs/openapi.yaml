openapi: 3.1.0
info:
  title: SUMUT CONNECT API
  version: 1.0.0
  description: API baca-saja. Semua koordinat dikirim sebagai bujur lalu lintang (EPSG:4326).
servers:
  - url: http://127.0.0.1:4174/api/v1
paths:
  /health:
    get:
      summary: Status API dan versi PostGIS
      responses:
        '200':
          description: Basis data siap
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: {const: ok}
                  database: {type: string}
                  postgis: {type: string}
        '500': {$ref: '#/components/responses/Error'}
  /regions:
    get:
      summary: Batas semua wilayah berserta statistik
      responses:
        '200': {$ref: '#/components/responses/Collection'}
        '500': {$ref: '#/components/responses/Error'}
  /regions/{code}:
    get:
      summary: Batas dan statistik salah satu wilayah
      parameters:
        - {name: code, in: path, required: true, schema: {$ref: '#/components/schemas/Code'}}
      responses:
        '200': {$ref: '#/components/responses/Feature'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /facilities:
    get:
      summary: Daftar titik dengan filter spasial dan pagination
      parameters:
        - {name: category, in: query, schema: {$ref: '#/components/schemas/Category'}}
        - {name: region, in: query, schema: {$ref: '#/components/schemas/Code'}}
        - {name: q, in: query, schema: {type: string, maxLength: 120}}
        - {name: bbox, in: query, description: 'barat,selatan,timur,utara', schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 1000, default: 100}}
        - {name: offset, in: query, schema: {type: integer, minimum: 0, maximum: 100000, default: 0}}
      responses:
        '200': {$ref: '#/components/responses/Collection'}
        '400': {$ref: '#/components/responses/Error'}
  /facilities/{id}:
    get:
      summary: Fitur fasilitas berdasarkan ID OSM
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, pattern: '^[nw][0-9]+$'}}
      responses:
        '200': {$ref: '#/components/responses/Feature'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /categories:
    get:
      summary: Kategori fasilitas
      responses:
        '200':
          description: Daftar kategori
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: {$ref: '#/components/schemas/Category'}
                    name: {type: string}
  /statistics/summary:
    get:
      summary: Total fasilitas, wilayah, dan dataset
      responses:
        '200':
          description: Agregat
          content:
            application/json:
              schema:
                type: object
                properties:
                  regions: {type: integer}
                  facilities: {type: integer}
                  health: {type: integer}
                  education: {type: integer}
                  economy: {type: integer}
                  datasets: {type: integer}
  /statistics/regions:
    get:
      summary: Agregat per wilayah
      responses:
        '200':
          description: Agregat wilayah
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/RegionStat'}}
  /indicators:
    get:
      summary: Definisi indikator
      responses:
        '200':
          description: Daftar indikator hitungan
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: {enum: [total, health, education, economy]}
                    unit: {type: string}
                    aggregate: {const: count}
  /datasets:
    get:
      summary: Metadata dan lisensi dataset
      responses:
        '200':
          description: Sumber, lisensi, periode, dan validasi
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/Dataset'}}
  /analysis/radius:
    post:
      summary: Fasilitas di dalam radius garis lurus
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Radius'}
            example: {center: [98.6722, 3.5952], radiusKm: 5, category: health, limit: 5}
      responses:
        '200': {$ref: '#/components/responses/Analysis'}
        '400': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
  /analysis/nearest:
    post:
      summary: Kandidat terdekat menurut garis lurus
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [center]
              properties:
                center: {$ref: '#/components/schemas/Center'}
                category: {$ref: '#/components/schemas/Category'}
                limit: {type: integer, minimum: 1, maximum: 100, default: 10}
      responses:
        '200': {$ref: '#/components/responses/Analysis'}
        '400': {$ref: '#/components/responses/Error'}
  /analysis/compare:
    post:
      summary: Bandingkan dua wilayah berbeda
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [a, b]
              properties:
                a: {$ref: '#/components/schemas/Code'}
                b: {$ref: '#/components/schemas/Code'}
            example: {a: '1275', b: '1212'}
      responses:
        '200':
          description: Agregat dengan selisih A − B
          content:
            application/json:
              schema:
                type: object
                properties:
                  a: {$ref: '#/components/schemas/RegionStat'}
                  b: {$ref: '#/components/schemas/RegionStat'}
                  difference: {type: object, additionalProperties: {type: number}}
                  unit: {type: string}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
components:
  responses:
    Feature:
      description: Fitur GeoJSON
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Feature'}
    Collection:
      description: Koleksi GeoJSON
      content:
        application/json:
          schema:
            type: object
            required: [type, features]
            properties:
              type: {const: FeatureCollection}
              features: {type: array, items: {$ref: '#/components/schemas/Feature'}}
    Analysis:
      description: Hasil diurutkan dari yang terdekat
      content:
        application/json:
          schema:
            type: object
            required: [center, method, hits]
            properties:
              center: {$ref: '#/components/schemas/Center'}
              method: {type: string}
              radiusKm: {type: number}
              total: {type: integer}
              hits:
                type: array
                items:
                  type: object
                  properties:
                    facility: {$ref: '#/components/schemas/Feature'}
                    meters: {type: number, minimum: 0}
    Error:
      description: Kesalahan dengan request ID untuk penelusuran
      headers:
        X-Request-Id: {schema: {type: string}}
      content:
        application/json:
          schema:
            type: object
            required: [code, message, requestId]
            properties:
              code: {type: string}
              message: {type: string}
              requestId: {type: string}
  schemas:
    Code: {type: string, pattern: '^12[0-9]{2}$'}
    Category: {type: string, enum: [health, education, economy]}
    Center:
      type: array
      minItems: 2
      maxItems: 2
      prefixItems:
        - {type: number, minimum: 95, maximum: 102}
        - {type: number, minimum: -2, maximum: 6}
    Radius:
      type: object
      required: [center, radiusKm]
      properties:
        center: {$ref: '#/components/schemas/Center'}
        radiusKm: {type: number, minimum: 0.1, maximum: 100}
        category: {$ref: '#/components/schemas/Category'}
        limit: {type: integer, minimum: 1, maximum: 5000, default: 50}
    Feature:
      type: object
      required: [type, properties, geometry]
      properties:
        type: {const: Feature}
        properties: {type: object}
        geometry:
          type: object
          properties:
            type: {enum: [MultiPolygon, Point]}
            coordinates: {type: array}
    RegionStat:
      type: object
      properties:
        code: {$ref: '#/components/schemas/Code'}
        name: {type: string}
        source_id: {type: string}
        area_km2: {type: number}
        health: {type: integer}
        education: {type: integer}
        economy: {type: integer}
        total: {type: integer}
    Dataset:
      type: object
      properties:
        id: {type: string}
        title: {type: string}
        publisher: {type: string}
        url: {type: string, format: uri}
        license: {type: string}
        accessed: {type: string}
        observed: {type: string}
        updated: {type: string}
        crs: {type: string}
        unit: {type: string}
        count: {type: integer}
        validation: {type: string}
        limits: {type: string}
